services:
  loja-db:
    image: mysql:8.4
    container_name: loja-db-banco
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "3306:3306"
    volumes: 
      - meus_dados:/var/lib/mysql
      - ./database/bd.sql:/docker-entrypoint-initdb.d/bd.sql:ro
  
  loja-api:
    build: ./backend
    env_file:
      - .env
    image: loja-api-imagem
    container_name: loja-api-container
    ports:
      - "3000:3000"
    environment:
      BACK_HOST: ${DB_HOST}
      BACK_USER: ${DB_USER}
      BACK_PASSWORD: ${DB_PASSWORD}
      BACK_DATABASE: ${DB_DATABASE}
    depends_on:
      - loja-db
  
  loja-front:
    build: ./frontend
    image: loja-front-imagem
    container_name: loja-front-container
    ports:
      - "5173:5173"
    depends_on:
      - loja-api
volumes:
  meus_dados: